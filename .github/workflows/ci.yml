name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: lanter
          MYSQL_DATABASE: lanter_test
        ports: ['3306:3306']
        options: --health-cmd "mysqladmin ping -h 127.0.0.1 -planter" --health-interval 5s --health-timeout 5s --health-retries 20
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: lanter
          POSTGRES_DB: lanter_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      LANTER_TEST_MYSQL: host=127.0.0.1;port=3306;database=lanter_test;user=root;password=lanter
      LANTER_TEST_PGSQL: host=127.0.0.1;port=5432;database=lanter_test;user=postgres;password=lanter
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo, pdo_sqlite, pdo_mysql, pdo_pgsql
          coverage: none

      - run: composer install --no-interaction --no-progress --prefer-dist

      - name: Lint sources
        run: for f in src/*.php src/*/*.php build.php; do php -l "$f" > /dev/null || exit 1; done

      - name: Run tests (SQLite, MySQL, PostgreSQL, dist sync check)
        run: vendor/bin/phpunit

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/lanter.php
          generate_release_notes: true
